<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checkout — BuyFinix</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="extras.css">
<link rel="stylesheet" href="polish.css">
</head>
<body>
<header class="nav shell">
<a class="brand" href="index.html">BUY ⚡ FINIX</a>
</header>
<main class="shell page-shell">
<h1 class="page-title">Secure checkout.</h1>
<form class="demo-form checkout-grid">
<section class="panel form-grid">
<label>Full name<input class="field" required>
</label>
<label>Email<input class="field" type="email" required>
</label>
<label>Country code<input class="field" value="+880">
</label>
<label>WhatsApp number<input class="field" required>
</label>
<label class="wide">Order notes<input class="field">
</label>
<label class="wide">
<span>
<input type="checkbox" required> I accept the terms and conditions</span>
</label>
</section>
<aside class="panel">
<h2>Your order</h2>
<p>Netflix Premium 4K · 1 Month</p>
<p>Subtotal <b>৳399</b>
</p>
<p>Payment <b>Test mode — gateway later</b>
</p>
<hr>
<p>Total <b>৳399</b>
</p>
<button class="primary-action">Place test order</button>
<p class="form-status">
</p>
</aside>
</form>
</main>
<script src="pages.js">
</script>
<script src="store.js"></script>
</body>
</html>
