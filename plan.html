<link rel="preconnect" href="https://fonts.googleapis.com">

<body class="shop-page">
<header class="nav shell">
<a class="brand" href="index.html">BUY ⚡ FINIX</a>
<nav>
<a href="index.html">Home</a>
<a href="/plan">Shop</a>
<a href="account.html">My Account</a>
</nav>
</header>
<main class="shell page-shell">

<div class="category-tabs" id="category-tabs">
<button data-category="all">All</button><button data-category="subscriptions">Subscriptions</button><button data-category="combos">Combo Packs</button><button data-category="software">Software</button><button data-category="music">Music</button><button data-category="adult">Adult</button><button data-category="more">More Plans</button>
</div>
<div class="toolbar shop-filters">
<input id="shop-search" placeholder="Search plans..." aria-label="Search plans">
<select id="shop-category" aria-label="Filter by category">
<option value="all">All categories</option>
<option value="subscriptions">Subscriptions</option>

<option>Newest</option>
</select>
</div>

<div class="product-grid" id="shop-grid"></div>
<div class="hero-buttons">
<a href="#">1</a>
<a class="outline" href="#">2</a>
</div>
</main>
<script src="pages.js?v=route1"></script>
<script src="store.js?v=figma4"></script>
<script>window.BF_PRODUCTS=BF_PRODUCTS;window.bfCard=bfCard;</script>
<script src="figma-cards.js?v=figma12"></script>
<script>
(function(){
  const canonical='/plan';
  const normalize=()=>{ if(location.pathname!==canonical||location.search||location.hash) history.replaceState(null,'',canonical); };
  const rewriteLinks=()=>{
    document.querySelectorAll('a[href]').forEach(a=>{
      const raw=a.getAttribute('href')||'';
      if(/^(?:\.\/)?shop(?:\.html)?(?:[?#].*)?$/.test(raw)||raw.startsWith('/shop')) a.setAttribute('href',canonical);
    });
  };

  const applyFigmaPlanNav=()=>{
    const header=document.querySelector('header.nav');
    if(!header)return;
    header.classList.add('shared-nav');
    const nav=header.querySelector(':scope > nav');
    if(nav){
      const drops=[...nav.querySelectorAll('.nav-drop')];
      const categories=drops.find(d=>/^Categories|^Login Terms/.test(d.querySelector('button')?.textContent.trim()||''));
      const loginButton=categories?.querySelector('button');
      if(loginButton&&loginButton.textContent.trim()!=='Login Terms')loginButton.textContent='Login Terms';
      if(loginButton&&!loginButton.dataset.loginTerms){
        loginButton.dataset.loginTerms='1';
        loginButton.addEventListener('click',event=>{
          event.preventDefault();event.stopImmediatePropagation();location.href='legal.html#login';
        },true);
      }
      const quick=[...nav.querySelectorAll('.nav-drop')].find(d=>/^Quick Links/.test(d.querySelector('button')?.textContent.trim()||''));
      const quickButton=quick?.querySelector('button');
      if(quickButton&&quickButton.textContent.trim()!=='Quick Links')quickButton.textContent='Quick Links';
    }
  };
  applyFigmaPlanNav();

  normalize();
  rewriteLinks();
  document.addEventListener('click',event=>{
    if(event.target.closest('[data-category],a[href*="shop"]')) setTimeout(()=>{normalize();rewriteLinks();},0);
  },true);
  document.addEventListener('input',()=>setTimeout(normalize,0),true);
  document.addEventListener('change',()=>setTimeout(normalize,0),true);
  [0,50,250,1000].forEach(delay=>setTimeout(()=>{rewriteLinks();applyFigmaPlanNav();},delay));
})();
</script>
<script src="plan-reference-fix.js?v=6"></script>
</body>
</html>
