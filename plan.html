<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plans — BuyFinix</title>
<link rel="canonical" href="https://buyfinix.com/plan">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=figma4">
<link rel="stylesheet" href="extras.css?v=figma4">
<link rel="stylesheet" href="polish.css?v=figma4">
<link rel="stylesheet" href="shop-figma.css?v=8">
</head>
<body class="shop-page">
<header class="nav shell">
<a class="brand" href="index.html">BUY ⚡ FINIX</a>
<nav>
<a href="index.html">Home</a>
<a href="/plan">Shop</a>
<a href="account.html">My Account</a>
</nav>
</header>
<main class="shell page-shell">

<div class="category-tabs" id="category-tabs">
<button data-category="all">All</button><button data-category="subscriptions">Subscriptions</button><button data-category="combos">Combo Packs</button><button data-category="software">Software</button><button data-category="music">Music</button><button data-category="adult">Adult</button><button data-category="more">More Plans</button>
</div>
<div class="toolbar shop-filters">
<input id="shop-search" placeholder="Search plans..." aria-label="Search plans">
<select id="shop-category" aria-label="Filter by category">
<option value="all">All categories</option>
<option value="subscriptions">Subscriptions</option>
<option value="combos">Combo Packs</option>
<option value="software">Software</option>
<option value="music">Music</option>
<option value="adult">Adult</option>
</select>
<select id="shop-sort" aria-label="Sort products">
<option>Sort: Featured</option>
<option>Price low to high</option>
<option>Newest</option>
</select>
</div>
<div class="shop-meta"><p id="product-count">Loading plans…</p></div>
<div class="product-grid" id="shop-grid"></div>
<div class="hero-buttons">
<a href="#">1</a>
<a class="outline" href="#">2</a>
</div>
</main>
<script src="pages.js?v=route1"></script>
<script src="store.js?v=figma4"></script>
<script src="figma-cards.js?v=figma11"></script>
<script>
(function(){
  const canonical='/plan';
  const normalize=()=>{ if(location.pathname!==canonical||location.search||location.hash) history.replaceState(null,'',canonical); };
  const rewriteLinks=()=>{
    document.querySelectorAll('a[href]').forEach(a=>{
      const raw=a.getAttribute('href')||'';
      if(/^(?:\.\/)?shop(?:\.html)?(?:[?#].*)?$/.test(raw)||raw.startsWith('/shop')) a.setAttribute('href',canonical);
    });
  };

  const applyFigmaPlanNav=()=>{
    const header=document.querySelector('header.nav');
    if(!header)return;
    header.classList.add('shared-nav');
    const brand=header.querySelector('.brand');
    if(brand&&!brand.dataset.figmaNav){
      brand.dataset.figmaNav='1';
      brand.innerHTML='<span>BUY</span><img src="https://www.figma.com/api/mcp/asset/6387bafc-a8a7-4e1f-b192-177aa6872bfc/77638.svg" alt="" width="15" height="15"><span>FINIX</span>';
      brand.setAttribute('href','index.html');
    }
    const nav=header.querySelector(':scope > nav');
    if(nav){
      const drops=[...nav.querySelectorAll('.nav-drop')];
      const categories=drops.find(d=>/^Categories/.test(d.querySelector('button')?.textContent.trim()||''));
      if(categories)categories.remove();
      if(!nav.querySelector('[data-login-terms]')){
        const login=document.createElement('a');
        login.href='legal.html#login';login.textContent='Login Terms';login.dataset.loginTerms='1';
        const shop=[...nav.children].find(el=>el.matches('a')&&el.textContent.trim()==='Shop');
        shop?.insertAdjacentElement('afterend',login);
      }
      const quick=[...nav.querySelectorAll('.nav-drop')].find(d=>/^Quick Links/.test(d.querySelector('button')?.textContent.trim()||''));
      const quickButton=quick?.querySelector('button');
      if(quickButton)quickButton.textContent='Quick Links';
    }
    const search=header.querySelector('#global-search');
    if(search&&!search.dataset.figmaIcon){search.dataset.figmaIcon='1';search.innerHTML='<img src="https://www.figma.com/api/mcp/asset/6387bafc-a8a7-4e1f-b192-177aa6872bfc/bb9f6.svg" alt="" width="22" height="22">';}
    const account=header.querySelector('.nav-actions>a');
    if(account&&!account.dataset.figmaIcon){account.dataset.figmaIcon='1';account.innerHTML='<img src="https://www.figma.com/api/mcp/asset/6387bafc-a8a7-4e1f-b192-177aa6872bfc/8c6f5.svg" alt="" width="22" height="22"><span>My Account</span>';}
    const cart=header.querySelector('#global-cart');
    if(cart&&!cart.dataset.figmaIcon){
      cart.dataset.figmaIcon='1';
      const badge=cart.querySelector('b');
      cart.innerHTML='<img src="https://www.figma.com/api/mcp/asset/6387bafc-a8a7-4e1f-b192-177aa6872bfc/92db0.svg" alt="" width="22" height="22">';
      if(badge)cart.appendChild(badge);
    }
  };
  applyFigmaPlanNav();

  normalize();
  rewriteLinks();
  document.addEventListener('click',event=>{
    if(event.target.closest('[data-category],a[href*="shop"]')) setTimeout(()=>{normalize();rewriteLinks();},0);
  },true);
  document.addEventListener('input',()=>setTimeout(normalize,0),true);
  document.addEventListener('change',()=>setTimeout(normalize,0),true);
  new MutationObserver(()=>{rewriteLinks();applyFigmaPlanNav();}).observe(document.documentElement,{childList:true,subtree:true});
})();
</script>
</body>
</html>
